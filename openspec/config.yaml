schema: spec-driven

context: |
  Projeto: Website pessoal de desenvolvedor (andersonlimacrv.com) combinando portfólio
  one-page com mini-blog, inspirado em padrões editoriais premium (lucasmontano.com como
  referência de estrutura, não de conteúdo). Estética quase monocromática (B&W), tipografia
  como elemento estrutural, seções numeradas, eyebrow em mono, retrato em preto e branco.

  Tech stack:
  - Astro (SSG, zero JS por padrão) + Tailwind CSS v4 (config via CSS)
  - Content Collections (Markdown/MDX tipado via content.config.ts) para o blog
  - astro:assets para otimização de imagem (retrato hero: src/assets/me.png, já em B&W)
  - @astrojs/sitemap, @astrojs/rss, View Transitions API (astro:transitions)
  - Fontes variáveis self-hosted: Manrope (display/corpo), JetBrains Mono (eyebrows),
    Fraunces (citações/pull-quotes) — nunca Google Fonts CDN em runtime
  - Ícones line style (Lucide), stroke="currentColor", sem fill

  Convenções:
  - Conventional commits (feat:, fix:, docs:, refactor:, chore:)
  - Nomeação de arquivos: kebab-case para módulos, PascalCase para componentes
  - Código em inglês; conteúdo público do site em português (pt-BR)
  - Acessibilidade: WCAG 2.1 AA, semântica HTML, :focus-visible, skip-link,
    prefers-reduced-motion
  - SEO: meta tags dinâmicas, sitemap, Open Graph, JSON-LD, GEO (/llms.txt,
    resposta direta primeiro)

  Domínio: marketing pessoal + conteúdo (mini-blog).

# Per-artifact rules (optional)
rules:
  proposal:
  - Manter propostas objetivas (< 400 palavras)
  - Sempre incluir seção "Non-goals"
  - Vincular a capability existente ou indicar nova
  design:
  - Apontar bibliotecas reutilizáveis do projeto antes de criar nova
  - Justificar escolhas de estado/dados e rotas
  tasks:
  - Granularidade máx. 2h por tarefa
  - Incluir tarefa de testes/acessibilidade quando houver UI
