schema: spec-driven

context: |
  Projeto: Website pessoal de desenvolvedor (andersonlimacrv.com) combinando portfólio,
  blog, vitrine de projetos e loja de produtos digitais.

  Tech stack:
  - Vite + React 18 + TypeScript (strict)
  - Tailwind CSS v4 com design tokens via CSS variables (tema claro/escuro)
  - shadcn/ui para componentes primitivos
  - tweakcn para composição/variants de componentes
  - React Router v6 para rotas client-side
  - MDX para conteúdo do blog e casos de estudo

  Convenções:
  - Conventional commits (feat:, fix:, docs:, refactor:, chore:)
  - Nomeação de arquivos: kebab-case para módulos, PascalCase para componentes
  - Código em inglês; conteúdo público do site em português (pt-BR)
  - Acessibilidade: WCAG 2.1 AA, semântica HTML, focus visível
  - SEO: meta tags dinâmicas, sitemap, Open Graph, dados estruturados JSON-LD

  Domínio: marketing pessoal + conteudo + micropagamentos (produtos digitais).

# Per-artifact rules (optional)
rules:
  proposal:
  - Manter propostas objetivas (< 400 palavras)
  - Sempre incluir seção "Non-goals"
  - Vincular a capability existente ou indicar nova
  design:
  - Apontar bibliotecas reutilizáveis do projeto antes de criar nova
  - Justificar escolhas de estado/dados e rotas
  tasks:
  - Granularidade máx. 2h por tarefa
  - Incluir tarefa de testes/acessibilidade quando houver UI
